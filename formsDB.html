
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Clientes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
        }

        h2, h3 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #3978d6;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2459a8;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            background: #f1f5fb;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dce4ef;
        }

        .botoes {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Cadastro de Clientes</h2>

    <input id="nome" placeholder="Nome">
    <input id="endereco" placeholder="Endereço">
    <input id="telefone" placeholder="Telefone">

    <div class="botoes">
        <button onclick="adicionarCliente()">Adicionar</button>
    </div>

    <h3>Lista de Clientes</h3>

    <ul id="listaClientes"></ul>

</div>

<script>

    function carregarClientes() {

        const clientes =
        JSON.parse(localStorage.getItem('clientes')) || [];

        const lista = document.getElementById('listaClientes');

        lista.innerHTML = '';

        clientes.forEach((cliente, index) => {

            const item = document.createElement('li');

            item.textContent =
                `${cliente.nome} - ${cliente.endereco} - ${cliente.telefone}`;

            item.innerHTML += `
                <button onclick="editarCliente(${index})">Editar</button>
                <button onclick="excluirCliente(${index})">Excluir</button>
            `;

            lista.appendChild(item);

        });
    }

    function adicionarCliente() {

        const nome = document.getElementById('nome').value;
        const endereco = document.getElementById('endereco').value;
        const telefone = document.getElementById('telefone').value;

        if (!nome || !endereco || !telefone) {
            alert("Preencha todos os campos!");
            return;
        }

        const clientes =
        JSON.parse(localStorage.getItem('clientes')) || [];

        clientes.push({ nome, endereco, telefone });

        localStorage.setItem('clientes', JSON.stringify(clientes));

        document.getElementById('nome').value = '';
        document.getElementById('endereco').value = '';
        document.getElementById('telefone').value = '';

        carregarClientes();

        alert("Cliente cadastrado com sucesso!");
    }

    function excluirCliente(index) {

        if (confirm("Deseja realmente excluir este cliente?")) {

            const clientes =
            JSON.parse(localStorage.getItem('clientes'));

            clientes.splice(index, 1);

            localStorage.setItem('clientes', JSON.stringify(clientes));

            carregarClientes();
        }
    }

    function editarCliente(index) {

        const clientes =
        JSON.parse(localStorage.getItem('clientes'));

        const cliente = clientes[index];

        document.getElementById('nome').value = cliente.nome;
        document.getElementById('endereco').value = cliente.endereco;
        document.getElementById('telefone').value = cliente.telefone;

        excluirCliente(index);
    }

    carregarClientes();

</script>

</body>
</html>
